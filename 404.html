<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面走丢了 | Craig</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/imgs/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            color: #0F172A;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 1.5rem;
        }
        .container { text-align: center; max-width: 480px; }
        .code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
        p { color: #64748B; margin-bottom: 2rem; line-height: 1.7; }
        a {
            display: inline-block;
            background: #2563EB;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            transition: background 0.3s ease, transform 0.2s ease;
        }
        a:hover { background: #1D4ED8; transform: translateY(-2px); }
        .emoji { font-size: 3rem; display: block; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>页面走丢了</h1>
        <p>你要找的内容可能被移动、删除。<br>也许他们存在过，但现在已无他用。<br>回到首页，继续逛逛吧。</p>
        <a href="/">返回首页</a>
        <span class="emoji">⚡</span>
    </div>
</body>
</html>
